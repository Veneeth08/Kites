# .github/workflows/release.yml

name: Qt Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # ---------------- LINUX ----------------
          - os: ubuntu-22.04
            qt_version: '6.9.2'
            qt_arch: linux_gcc_64
            qt_tools: ''
            executable_path: build/Kites

          # ---------------- WINDOWS ----------------
          - os: windows-latest
            qt_version: '6.9.2'
            qt_arch: win64_mingw
            qt_tools: 'tools_mingw1310'
            executable_path: build/Kites.exe

          # ---------------- MACOS ----------------
          - os: macos-latest
            qt_version: '6.9.2'
            qt_arch: clang_64
            qt_tools: ''
            executable_path: build/Kites.app

    runs-on: ${{ matrix.os }}

    steps:
      # --------------------------------------------
      # Checkout
      # --------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------
      # Install Qt
      # --------------------------------------------
      - name: Install Qt 
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          tools: ${{ matrix.qt_tools }}

      # --------------------------------------------
      # Configure CMake
      # --------------------------------------------
      - name: Configure
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 -DCMAKE_CXX_STANDARD_REQUIRED=ON

      - name: Configure CMake (MinGW)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      # --------------------------------------------
      # Build
      # --------------------------------------------
      - name: Build
        run: cmake --build build --config Release -j12

      # ============================================
      # LINUX PACKAGING
      # ============================================
      - name: Install Linux Packaging Tools
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y zip wget fuse libfuse2

      - name: Download linuxdeployqt
        if: runner.os == 'Linux'
        run: |
          wget https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Create Linux AppImage
        if: runner.os == 'Linux'
        env:
          QMAKE : ${{ env.QT_DIR }}/bin/qmake
        run: |
          mkdir -p AppDir/usr/bin
          cp build/Kites AppDir/usr/bin/
          cp resources/icons/kite.png AppDir/Kites.png

          cat > AppDir/Kites.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Kites
          Exec=Kites
          Icon=Kites
          Categories=Utility;
          EOF

          ./linuxdeployqt-continuous-x86_64.AppImage \
            AppDir/Kites.desktop \
            -appimage

      - name: Zip Linux AppImage
        if: runner.os == 'Linux'
        run: |
          archive_name="kites-linux-${GITHUB_REF_NAME}.zip"
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"
          zip "$archive_name" *.AppImage

      # ============================================
      # WINDOWS PACKAGING
      # ============================================
      - name: Prepare Windows Package Directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "Kites-Posit-Windows"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "build\Kites.exe" $packageDir
          @"
          Kites Posit Extension for Windows
          Version: $env:GITHUB_REF_NAME
          Qt version: ${{ matrix.qt_version }}
          Qt kit: ${{ matrix.qt_arch }}

          To run Kites, extract this ZIP and double-click Kites.exe.
          No Qt installation or development tools are required.
          "@ | Set-Content -Path "$packageDir\README.txt" -Encoding utf8

      - name: Run windeployqt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "Kites-Posit-Windows"
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --compiler-runtime "$packageDir\Kites.exe"

      - name: Zip Windows Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "Kites-Posit-Windows"
          $archiveName = "Kites-Posit-Windows.zip"
          "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Compress-Archive `
            -Path "$packageDir\*" `
            -DestinationPath $archiveName

      - name: Smoke test extracted Windows ZIP without Qt/toolchain PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP "Kites-Portable-Smoke"
          Expand-Archive -Path $env:ARCHIVE_NAME -DestinationPath $smokeDir -Force
          $packageDir = (Resolve-Path $smokeDir).Path
          $oldPath = $env:PATH
          $oldQtRoot = $env:QT_ROOT_DIR
          $oldPluginPath = $env:QT_PLUGIN_PATH
          $oldQpaPath = $env:QT_QPA_PLATFORM_PLUGIN_PATH
          try {
            $env:PATH = (($oldPath -split ';' | Where-Object { $_ -and $_ -notlike "$oldQtRoot*" -and $_ -notmatch 'mingw' }) -join ';')
            Remove-Item Env:QT_ROOT_DIR -ErrorAction SilentlyContinue
            Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath "$packageDir\Kites.exe" -WorkingDirectory $packageDir -PassThru
            Start-Sleep -Seconds 5
            if ($process.HasExited) { throw "Kites exited during portable ZIP smoke test (code $($process.ExitCode))." }
            Stop-Process -Id $process.Id -Force
          } finally {
            $env:PATH = $oldPath
            $env:QT_ROOT_DIR = $oldQtRoot
            if ($oldPluginPath) { $env:QT_PLUGIN_PATH = $oldPluginPath }
            if ($oldQpaPath) { $env:QT_QPA_PLATFORM_PLUGIN_PATH = $oldQpaPath }
          }

      # ============================================
      # MACOS PACKAGING
      # ============================================
      - name: Run macdeployqt
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/Kites.app

      - name: Zip macOS App
        if: runner.os == 'macOS'
        run: |
          archive_name="kites-macos-${GITHUB_REF_NAME}.zip"
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent \
            build/Kites.app \
            "$archive_name"

      # ============================================
      # Upload Release Assets
      # ============================================
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}
          generate_release_notes: true
